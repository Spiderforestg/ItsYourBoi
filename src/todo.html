<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>It's Your Boi To-do List</title>
  <link href="boi.css" rel="stylesheet">
  <link href="css/todo.css" rel="stylesheet">
  <script src="features/todo/todo.js" type="module"></script>
</head>

<body>
  <header>
    <h1>Your Boi's To-do List</h1>
    <h3></h3>
  </header>

  <main>  
    <section id="main">
      <table id="todo-table">
        <tr class="todo-row">
          <td class="todo-header" class="todo-name">Name</td>
          <td class="todo-header" class="todo-type">Type</td>
        </tr>
      </table>

      <!--Form to add a To-do list item-->
      <form id="todo-form">
        <!--Input a -->
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Name">
        <br>
      
        <input id="once" name="type" type="radio" value="Once" checked>
        <label for="once">Once</label>
        <input id="daily" name="type" type="radio" value="Daily">
        <label for="daily">Daily</label>
        <input id="weekly" name="type" type="radio" value="Weekly">
        <label for="weekly">Weekly</label>
        <br>

        <input id="add-item-button" type="button" value="Add item">
        <br>

        <span id="form-error"></span>
      </form>
    </section>
  </main>



  <footer>
    <img alt="Logo Img" src="assets/icon.svg" id="logo">
    <div id="credits">
      <a href="index.html">Open In New Page</a>
      <br>
      <a href="https://github.com/Spiderforestg/ItsYourBoi">See The Source Code</a>
    </div>
  </footer>
</body>

</html>
