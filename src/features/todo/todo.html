<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tasks | It's Your Boi</title>
  <link href="../../css/main.css" rel="stylesheet">
  <link href="../../css/todo.css" rel="stylesheet">
  <script src="todo.js" type="module"></script>
</head>

<body>
  <header>
    <h1>Your Boi's To-do List</h1>
    <h3></h3>
  </header>

  <main>  
    <section id="main">
      <table id="todo-table">
        <tr class="todo-row">
          <td class="todo-header" class="todo-name">Name</td>
          <td class="todo-header" class="todo-difficulty">Difficulty</td>
          <td class="todo-header" class="todo-completed">Completed</td>
        </tr>
      </table>

      <!--Form to add a To-do list item-->
      <form id="todo-form">
        <!--Input a name for the To-do item-->
        <label id="name-label" for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Name">
        <br>
      
        <input id="easy" name="difficulty" type="radio" value="Easy">
        <button id="easy-button" for="easy">Easy</button>
        <input id="medium" name="difficulty" type="radio" value="Medium">
        <button id="medium-button" for="medium">Medium</button>
        <input id="hard" name="difficulty" type="radio" value="Hard">
        <button id="hard-button" for="hard">Hard</button>
        <br>

        <input id="add-item-button" type="button" value="Add item">
        <input id="clear-list-button" type="button" value="Clear List">
        <br>

        <span id="form-error"></span>
      </form>
    </section>
  </main>



  <footer>
    <img alt="Logo Img" src="../../assets/icon.svg" id="logo">
    <div id="credits">
      <a href="../../../index.html">Open In New Page</a>
      <br>
      <a href="https://github.com/Spiderforestg/ItsYourBoi">See The Source Code</a>
    </div>
  </footer>
</body>

</html>
