<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pomodoro.css">
    <title>Pomodoro - It's Your Boi</title>
</head>
<body>
    <section class="widget" aria-label="Pomodoro timer">
        <section class="timer-card" aria-label="Pomodoro timer">
            <div class="modes" role="group" aria-label="Session type">
                <button type="button" data-mode="focus" aria-pressed="true">Focus</button>
                <button type="button" data-mode="short" aria-pressed="false">Short break</button>
                <button type="button" data-mode="long" aria-pressed="false">Long break</button>
            </div>

            <div class="dial" id="dial">
                <div class="dial-inner">
                    <span class="phase" id="phase">TIME TO LOCK IN</span>
                    <div id="time" role="timer" aria-label="Time remaining">25:00</div>
                    <span class="timer-hint" id="timer-hint">Next: short break</span>
                </div>
            </div>

            <div class="controls">
                <button id="reset" class="icon-button" type="button" aria-label="Reset current session">↺</button>
                <button id="start" class="primary" type="button">Start focusing <span aria-hidden="true">▶</span></button>
                <button id="settings-toggle" class="icon-button" type="button" aria-label="Timer settings" aria-expanded="false" aria-controls="settings">⚙</button>
            </div>

            <div id="cycle" class="cycle" role="group" aria-label="Focus sessions in this cycle">
                <span class="cycle-dot filled" aria-hidden="true"></span>
                <span class="cycle-dot filled" aria-hidden="true"></span>
                <span class="cycle-dot" aria-hidden="true"></span>
                <span class="cycle-dot" aria-hidden="true"></span>
                <span class="cycle-label">2/4 to a long break</span>
            </div>
            <p id="message" class="message" role="status" hidden></p>
        </section>

        <section id="settings" class="panel" aria-labelledby="settings-title" hidden>
            <div class="panel-heading">
                <h2 id="settings-title">SESSION LENGTHS</h2>
                <span>MIN</span>
            </div>
            <p>Find your rhythm. Changing lengths resets the current timer.</p>
            <form id="settings-form">
                <div class="settings-grid">
                    <label>Focus<input name="focus" type="number" min="1" max="120" step="1" value="25" required></label>
                    <label>Short break<input name="short" type="number" min="1" max="120" step="1" value="5" required></label>
                    <label>Long break<input name="long" type="number" min="1" max="120" step="1" value="15" required></label>
                </div>
                <button class="small-button" type="submit">Save lengths</button>
            </form>
        </section>
    </section>
    <script type="module" src="pomodoro.js"></script>
</body>
</html>
