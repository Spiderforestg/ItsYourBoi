<!DOCTYPE html>

<head>

<body>
  <main class="home shop-home">
    <section class="pet-room shop-room" aria-labelledby="shop-title">

        <div class="shop-title-row">
          <h1 id="shop-title">THE SHOP</h1>
          <span class="menu-icon shop-icon" aria-hidden="true"></span>
        </div>
        <div class="shop-stats">
          <p id="shop-level">Lv. —</p>
          <p class="gold-balance"><span class="coin-icon" aria-hidden="true"></span><span><span id="shop-gold">—</span> GOLD</span></p>
        </div>
      </header>
      <div class="shop-toolbar"><div class="shop-tabs" role="group" aria-label="Filter shop items"><button type="button" data-filter="all" aria-pressed="true">ALL</button><button type="button" data-filter="clothes" aria-pressed="false">CLOTHES</button><button type="button" data-filter="food" aria-pressed="false">FOOD</button><button type="button" data-filter="hats" aria-pressed="false">HATS</button></div><p id="shop-status" role="status" aria-live="polite">Opening the shop...</p></div>
      <section class="shop-shelf" tabindex="0" aria-label="Shop items. Scroll to browse."><ul id="shop-items"></ul></section>
      <p class="inventory-note">Find your food in Feed. Dressing is coming soon.</p>
    </section>
    <nav class="menus home-menus" aria-label="Main navigation">

      <button type="button" disabled aria-label="Dress up (coming soon)"><span class="menu-icon dress-icon" aria-hidden="true"></span><span>DRESS</span></button>
      <a href="../fun-things/fun-things.html"><span class="menu-icon fun-icon" aria-hidden="true"></span><span class="fun-label">FUN<br>THINGS</span></a>
      <a href="../../../index.html"><span class="menu-icon start-icon" aria-hidden="true">←</span><span>START</span></a>
