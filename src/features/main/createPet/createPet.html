<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Your Pet · It's Your Boi</title>
</head>
<body>
    <h1>It's Your Boi</h1>
    <p>Welcome to It's Your Boi! <br>Your personal
    pet that grows with you as you study and complete tasks! <br>
    Please enter a pet name below to begin your journey!</p>
    <form id="nameForm">
        <label for="petName">Enter Pet Name Below</label>
        <input type="text" id="petName" name="petName" required>
        <button type="submit">Submit</button>
    </form>
    <p id="greeting" aria-live="polite"></p>
    <script src="createPet.js" defer></script>
</body>
</html>
